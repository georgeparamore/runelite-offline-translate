plugins {
    id 'java'
}

def runeLiteVersion = 'latest.release'
// Pinned below 0.30.0 deliberately: DJL dropped osx-x86_64 (Intel Mac) native SentencePiece
// binaries starting in 0.30.0, bundling only osx-aarch64 (Apple Silicon) from then on - using
// a newer version breaks with "Resource not found in classpath:
// native/lib/osx-x86_64/libsentencepiece_native.dylib" on Intel Macs at runtime, since it's a
// missing binary, not a code bug. 0.29.0 is the last release that still ships it, and its
// SpTokenizer/SpProcessor API is byte-for-byte identical to the current one.
def djlVersion = '0.29.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://repo.runelite.net'
    }
}

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'

    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'

    // Local (offline) translation inference - runs OPUS-MT ONNX models entirely on-device.
    // Raw ONNX Runtime is used directly (rather than DJL's Predictor/Translator abstraction)
    // because the merged encoder/decoder graphs need manual, named, multi-tensor KV-cache
    // wiring across generation steps that doesn't fit DJL's single-pass NDList model well.
    implementation group: 'ai.djl', name: 'api', version: djlVersion
    implementation group: 'ai.djl.sentencepiece', name: 'sentencepiece', version: djlVersion
    implementation group: 'com.microsoft.onnxruntime', name: 'onnxruntime', version: '1.22.0'

    // Offline language detection (n-gram based, no network/model download required).
    implementation group: 'com.optimaize.languagedetector', name: 'language-detector', version: '0.6'

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

group = 'com.offlinetranslate'
version = '0.1.0'

List<String> runeliteJvmArgs = ['-ea']
if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
{
    runeliteJvmArgs += ['--add-exports', 'java.desktop/com.apple.eawt=ALL-UNNAMED']
}

tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    description = 'Downloads a real language pack and runs translation directly, no RuneLite client needed.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.offlinetranslate.StandaloneTranslationSmokeTest'
    standardInput = System.in
}

tasks.register('runOfflineTranslate', JavaExec) {
    group = 'runelite'
    description = 'Launches RuneLite locally with the Offline Translate plugin registered.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.offlinetranslate.OfflineTranslatePluginTest'
    standardInput = System.in
    jvmArgs runeliteJvmArgs
}
